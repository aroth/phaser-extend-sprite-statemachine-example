<!doctype html>
<html>
	<head>
		<meta charset="UTF-8" />
		<title>Killian - Phaser Demo</title>
		<script src="https://cdn.jsdelivr.net/npm/phaser@3.55.2/dist/phaser.min.js"></script>
		<script src="Killian.js"></script>
		<script src="stateMachine.js"></script>
	</head>
	<body>
		Press the RIGHT arrow key to change state.
		<br/><br/>
		<div id="state"></div>
		
		<script type="text/javascript">

 			window.onload = function() {

				var config = {
					type: Phaser.CANVAS,
					width: 320,
					height: 240,
					scene: {
						preload: preload,
						create: create,
						update: update
					}
				};

				var game = new Phaser.Game(config);
				var killian;

				function preload () {
				  this.load.atlas('killian', 'assets/sprites/killian.png', 'assets/sprites/killian.json');
				}

				function create () {
				  killian = new Killian(this, -50, -100);
				}

				function update(){
				  document.getElementById('state').innerHTML = "<b>state:</b> " + killian.sm.currentState;
				}
		
 		}
		</script>
	</body>
</html>
